<header class="border-b border-[#e5d8c7] bg-[#f7f0e6] text-[#453c31] shadow-[0_1px_2px_rgba(17,24,39,0.04),0_8px_24px_rgba(89,69,45,0.08)]">
  <div class="border-b border-white/15 bg-[#a75d37] text-white">
    <a :href="libraryHref" class="mx-auto flex h-7 max-w-7xl items-center justify-center gap-2 px-4 text-[11px] font-semibold text-white">
      <span aria-hidden="true">✦</span>
      <span>New summaries added weekly. Read the next big idea in 10 minutes.</span>
    </a>
  </div>
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-8">
    <div class="flex min-w-0 items-center gap-7">
      <a :href="homeHref" class="flex min-h-11 min-w-0 items-center gap-3 rounded-2xl pe-2">
        <svg class="h-9 w-9 shrink-0 text-[#374151]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span class="flex min-w-0 flex-col items-center leading-none text-center">
          <span class="block truncate text-[22px] font-semibold tracking-tight text-[#374151]">BookBriefs</span>
          <span class="mt-0.5 text-[14px] font-semibold italic tracking-tight text-[#374151]" style="font-family: Newsreader, serif">Ta7leel</span>
        </span>
      </a>
      <nav class="flex items-center gap-1" aria-label="Primary navigation">
        <a :href="libraryHref" class="inline-flex h-10 items-center gap-1 rounded-full px-3 text-sm font-semibold" :class="{ 'bg-white text-gray-950 shadow-sm': activeItem === 'library' }">Library <span aria-hidden="true">⌄</span></a>
        <a :href="calculatorsHref" class="inline-flex h-10 items-center gap-1 rounded-full px-3 text-sm font-semibold" :class="{ 'bg-white text-gray-950 shadow-sm': activeItem === 'tools' }">Tools <span aria-hidden="true">⌄</span></a>
        <a :href="blogHref" class="inline-flex h-10 items-center gap-1 rounded-full px-3 text-sm font-semibold" :class="{ 'bg-white text-gray-950 shadow-sm': activeItem === 'learn' }">Learn <span aria-hidden="true">⌄</span></a>
      </nav>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/55 text-[#574f43] shadow-[inset_0_0_0_1px_rgba(89,69,45,0.07)]" aria-label="Open search">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      </button>
      <a href="https://ko-fi.com/ta7leel" class="inline-flex min-h-10 items-center rounded-xl bg-[#a75d37] px-4 py-2 text-sm font-bold text-white shadow-[0_10px_22px_rgba(167,93,55,0.24)]">Support</a>
      <button type="button" class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/55 text-[#574f43] shadow-[inset_0_0_0_1px_rgba(89,69,45,0.07)]" aria-label="User menu">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </div>
  <div v-if="isSearchOpen" class="mx-auto max-w-7xl px-8 pb-3">
    <label class="sr-only" for="draft-search">Search books</label>
    <input id="draft-search" type="search" dir="auto" placeholder="Search books..." class="ms-auto block w-[22rem] rounded-2xl bg-white px-4 py-3 text-sm text-gray-950 shadow-[0_18px_40px_rgba(89,69,45,0.18)] outline-none ring-1 ring-gray-950/5" />
  </div>
</header>
