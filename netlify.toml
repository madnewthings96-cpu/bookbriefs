[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Disable secret scanning for Firebase client keys (they're meant to be public)
  NETLIFY_SKIP_SECRET_SCANNING = "true"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Prevent XSS attacks (relaxed for development)
    Content-Security-Policy = """
      default-src 'self' 'unsafe-inline' 'unsafe-eval';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://* http://localhost:* http://127.0.0.1:*;
      style-src 'self' 'unsafe-inline' https://*;
      img-src 'self' data: https: blob: http:;
      font-src 'self' data: https://*;
      connect-src 'self' https://* http://localhost:* http://127.0.0.1:* wss://*;
      frame-src 'self' https://*;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://*;
    """
    # Prevent clickjacking attacks (SAMEORIGIN allows embedding in your own domain)
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy (formerly Feature Policy)
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # HSTS - Force HTTPS (31536000 seconds = 1 year)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200