<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="coffee-title coffee-description">
  <title id="coffee-title">A warm cup of coffee for Ta7leel</title>
  <desc id="coffee-description">A cream coffee cup with a gold heart, forest-green outline, and gently rising steam.</desc>

  <style>
    .cup {
      transform-box: fill-box;
      transform-origin: 50% 88%;
      animation: cup-settle 2.35s cubic-bezier(.22, 1, .36, 1) 1 both;
    }

    .steam {
      fill: none;
      stroke: #4a6741;
      stroke-linecap: round;
      stroke-width: 6;
      opacity: .58;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: steam-rise 2.2s cubic-bezier(.2, .8, .2, 1) 1 both;
    }

    .steam-left { animation-delay: .1s; }
    .steam-right { animation-delay: .34s; }

    @keyframes cup-settle {
      0% { opacity: 0; transform: translateY(10px) rotate(-3deg) scale(.96); }
      48% { opacity: 1; transform: translateY(0) rotate(1.25deg) scale(1.01); }
      74% { transform: rotate(-.45deg) scale(1); }
      100% { opacity: 1; transform: rotate(0) scale(1); }
    }

    @keyframes steam-rise {
      0% { opacity: 0; transform: translateY(9px) scaleY(.72); }
      24% { opacity: .72; }
      72% { opacity: .58; }
      100% { opacity: .58; transform: translateY(-4px) scaleY(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cup,
      .steam {
        animation: none;
      }

      .steam {
        opacity: .58;
      }
    }
  </style>

  <ellipse cx="120" cy="197" rx="69" ry="12" fill="#143d2d" opacity=".1"/>

  <g class="steam" aria-hidden="true">
    <path class="steam-left" d="M94 82c-12-13 10-19 0-34-7-11-1-20 7-27"/>
    <path class="steam-right" d="M139 82c12-13-10-19 0-34 7-11 1-20-7-27"/>
  </g>

  <g class="cup">
    <path d="M56 99h112v57c0 24-19 43-43 43H99c-24 0-43-19-43-43V99Z" fill="#fbf8f1" stroke="#304529" stroke-width="7" stroke-linejoin="round"/>
    <path d="M167 112h11c21 0 32 13 32 30s-12 30-33 30h-18" fill="none" stroke="#304529" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 104c14 10 77 10 92 0" fill="none" stroke="#c49552" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <path d="M112 170c-3-4-19-14-19-27 0-9 6-15 14-15 6 0 11 3 14 8 3-5 8-8 14-8 8 0 14 6 14 15 0 13-16 23-28 32-3-2-6-4-9-5Z" fill="#c49552"/>
    <path d="M79 117c-7 9-10 20-10 32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  </g>
</svg>
